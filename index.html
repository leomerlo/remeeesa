<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The tab icon is the app icon itself (the dino), cropped in from
         icon-512.png so it reads at 16px. It used to point at a favicon.svg
         left over from the template -- a generic violet bolt that had
         nothing to do with this app. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7b5cfa" />
    <!-- Lets "Agregar a inicio" on iOS open full-screen (no Safari chrome)
         instead of just bookmarking the page, and names the home-screen
         icon "reméeesa" instead of the page's <title>. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="reméeesa" />
    <title>remeeesa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

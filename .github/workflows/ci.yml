name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The rules, actually executed against the Firestore emulator -- the
      # one thing the suite above cannot do, since it runs entirely against
      # the in-memory adapter, which has no rules. A rule that forbids what
      # the app really writes passes every other test and fails only in
      # production; that happened twice in one day before this existed.
      #
      # The emulator is a Java process, which is why this is a CI step: the
      # runner has a JDK, not every machine does.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:rules
      # And the app itself, in a browser, against those same emulators: the
      # one place the screens, the Firestore adapter and the rules run
      # together. It found a real bug on its first green run -- a
      # brand-new household had no navigation until the page was reloaded.
      # `--with-deps` pulls font packages from Ubuntu's apt mirrors, and
      # when those mirrors are unreachable from the runner -- which has
      # happened for half an hour at a time -- the step fails and takes a
      # green branch red for a reason that has nothing to do with the
      # code. The browser itself comes from Playwright's own CDN, so on
      # that failure we install it alone: the system libraries Chromium
      # needs are already on this image, and the fonts those packages add
      # are for scripts this app does not render.
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

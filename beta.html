<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- The beta's own icon, not the v1's: no more dinosaur. The mark is
         the three e's of the logo, and the files come out of
         scripts/beta-icons.mjs. Its own files rather than the shared
         favicon-*.png, so nobody's home screen changes under them while
         the v1 is still the app people use. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/beta-icon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/beta-icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/beta-icon-16.png" />
    <!-- iOS ignores the manifest and wants exactly this one. -->
    <link rel="apple-touch-icon" href="/beta-icon-180.png" />
    <link rel="manifest" href="/beta.webmanifest" />
    <meta name="theme-color" content="#4d1f8d" />
    <!-- Same reason as index.html: without viewport-fit=cover every
         env(safe-area-inset-*) reads zero on a notched iPhone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="reméeesa" />
    <!-- Nothing here is ready to be found by a search engine. -->
    <meta name="robots" content="noindex" />
    <title>remeeesa · beta</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/beta/main.tsx"></script>
  </body>
</html>
